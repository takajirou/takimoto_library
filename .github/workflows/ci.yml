name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: takimoto_library_test
          MYSQL_USER: takimoto_user
          MYSQL_PASSWORD: takimoto_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: takimoto_library_test
      DB_USERNAME: takimoto_user
      DB_PASSWORD: takimoto_password

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.3-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Initialize test database
        env:
          MYSQL_PWD: root
        run: mysql --host=127.0.0.1 --port=3306 --user=root < database/init/002_create_test_tables.sql

      - name: Run tests
        run: composer test
